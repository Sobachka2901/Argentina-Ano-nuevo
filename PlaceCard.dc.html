<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="{{ card.containerStyle }}" style-hover="{{ card.containerHoverStyle }}" onClick="{{ card.onSelect }}">
  <sc-if value="{{ card.showNum }}" hint-placeholder-val="{{ false }}">
    <div style="{{ card.numStyle }}">{{ card.num }}</div>
  </sc-if>
  <div style="{{ card.photoStyle }}" onClick="{{ card.onOpenInfo }}">
    <sc-if value="{{ card.photo }}" hint-placeholder-val="{{ false }}">
      <img src="{{ card.photo }}" alt="{{ card.name }}" style="width:100%;height:100%;object-fit:cover;display:block;" loading="lazy" />
    </sc-if>
    <sc-if value="{{ card.noPhoto }}" hint-placeholder-val="{{ true }}">
      <image-slot id="{{ card.slotId }}" shape="rect" placeholder="{{ card.catIco }} foto de {{ card.name }}" style="width:100%;height:100%;"></image-slot>
    </sc-if>
    <sc-if value="{{ card.isCasaTile }}" hint-placeholder-val="{{ false }}">
      <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;">
        <span style="font-size:2rem;line-height:1;">🏠</span>
        <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:0.62rem;color:#111;text-align:center;padding:0 8px;line-height:1.3;">{{ card.addr }}</span>
      </div>
    </sc-if>
    <span style="{{ card.stampStyle }}">{{ card.catLabel }}</span>
    <button onClick="{{ card.onToggleFav }}" style="{{ card.favStyle }}" title="Favorito">★</button>
  </div>
  <sc-if value="{{ card.showPopup }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ card.stopPropPopup }}" style="position:absolute;top:14px;left:10px;right:10px;z-index:60;">
      <div style="background:#fff;border:2.5px solid #111;border-radius:10px;box-shadow:3px 3px 0 #111;padding:9px 10px 10px;position:relative;">
        <button onClick="{{ card.onClosePopup }}" aria-label="Cerrar" style="position:absolute;top:4px;right:4px;border:2px solid #111;background:#FFE800;color:#111;width:18px;height:18px;font-size:0.65rem;line-height:1;font-weight:800;cursor:pointer;border-radius:3px;">×</button>
        <div style="font-family:'Archivo Black',sans-serif;font-size:0.72rem;text-transform:uppercase;color:#111;padding-right:20px;line-height:1.2;">{{ card.name }}</div>
        <div style="font-size:0.66rem;color:#333;font-weight:600;margin-top:5px;line-height:1.4;">{{ card.popupDesc }}</div>
        <div style="display:inline-block;margin-top:7px;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:0.62rem;background:#111;color:#FFE800;padding:0.2rem 0.4rem;border-radius:3px;">{{ card.popupPrice }}</div>
        <div style="position:absolute;bottom:-7px;left:14px;width:12px;height:12px;background:#fff;border-right:2.5px solid #111;border-bottom:2.5px solid #111;transform:rotate(45deg);"></div>
      </div>
    </div>
  </sc-if>
  <div style="font-family:'Archivo Black',sans-serif;font-size:0.78rem;line-height:1.3;margin-top:0.5rem;color:#111;text-transform:uppercase;">{{ card.name }}</div>
  <sc-if value="{{ card.meta1 }}" hint-placeholder-val="{{ false }}">
    <div style="font-size:0.68rem;color:#444;margin-top:0.2rem;line-height:1.3;font-weight:600;">{{ card.meta1 }}</div>
  </sc-if>
  <sc-if value="{{ card.meta2 }}" hint-placeholder-val="{{ false }}">
    <div style="font-size:0.68rem;color:#444;margin-top:0.1rem;line-height:1.3;font-weight:600;">{{ card.meta2 }}</div>
  </sc-if>
  <sc-if value="{{ card.hasDist }}" hint-placeholder-val="{{ false }}">
    <div style="{{ card.distStyle }}">{{ card.dist }}</div>
  </sc-if>
  <div style="display:flex;gap:0.3rem;margin-top:0.5rem;">
    <a href="{{ card.mapsHref }}" target="_blank" rel="noopener" onClick="{{ card.stopProp }}" style="flex:1;text-align:center;text-decoration:none;font-size:0.6rem;font-weight:800;letter-spacing:0.03em;padding:0.3rem 0.2rem;border:2px solid #111;background:#fff;color:#111;text-transform:uppercase;">Maps</a>
    <sc-if value="{{ card.hasGo }}" hint-placeholder-val="{{ false }}">
      <a href="{{ card.dirHref }}" target="_blank" rel="noopener" onClick="{{ card.stopProp }}" style="flex:1;text-align:center;text-decoration:none;font-size:0.6rem;font-weight:800;letter-spacing:0.03em;padding:0.3rem 0.2rem;border:2px solid #111;background:#111;color:#FFE800;text-transform:uppercase;">Ir</a>
    </sc-if>
    <sc-if value="{{ card.showTick }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ card.onToggleDone }}" style="{{ card.tickStyle }}" title="Ya fuimos">✓</button>
    </sc-if>
  </div>
  <sc-if value="{{ card.showDaySel }}" hint-placeholder-val="{{ false }}">
    <select value="{{ card.dayValue }}" onChange="{{ card.onDayChange }}" onClick="{{ card.stopProp }}" style="width:100%;margin-top:0.3rem;font-family:'JetBrains Mono',monospace;font-size:0.58rem;border:2px solid #111;background:#fff;color:#111;padding:0.22rem;font-weight:700;">
      <sc-for list="{{ card.dayOptions }}" as="opt" hint-placeholder-count="1">
        <option value="{{ opt.id }}">{{ opt.chip }}</option>
      </sc-for>
    </select>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:240}}"></script>
</body>
</html>
